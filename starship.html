<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#050505" />

    <meta
      name="description"
      content="A first-person cinematic short: from the pad at Starbase to the first step on Mars."

    <link rel="preconnect" href="https://fonts.googleapis.com" />

      technical / diegetic text.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500&family=Jost:wght@200;300;400;500&display=swap"

    />

    <canvas id="stage" aria-label="First Step — cinematic first-person experience"></canvas>

    <script type="module" src="/src/main.js"></script>
